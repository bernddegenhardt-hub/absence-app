<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anmelden – Nachbarschaft</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card narrow-card">
    <h1>Anmelden</h1>
    <p class="lead">Melde dich an, um deine Abwesenheiten zu verwalten.</p>

    <form id="login-form" novalidate>
      <label>E-Mail-Adresse
        <input name="email" type="email" autocomplete="username" required autofocus>
        <small class="error" data-for="email"></small>
      </label>
      <label>Passwort
        <input name="password" type="password" autocomplete="current-password" required>
        <small class="error" data-for="password"></small>
      </label>
      <label class="checkbox">
        <input name="remember" type="checkbox"> Angemeldet bleiben (30 Tage)
      </label>

      <div id="form-message" role="alert"></div>
      <button type="submit">Anmelden</button>
    </form>
    <p class="switch">Noch kein Konto? <a href="/registrieren">Jetzt registrieren</a></p>
  </main>
  <script src="/login.js"></script>
</body>
</html>
